[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pen-ai"
version = "0.1.0"
description = "AI-powered adaptive penetration-testing operator for enterprise internal networks"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "PEN-AI Team"}
]
dependencies = [
    "rich>=13.7.0",
    "textual>=0.80.0",
    "typer>=0.12.0",
    "pydantic>=2.6.0",
    "aiosqlite>=0.20.0",
    "networkx>=3.2.0",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.1.0",
    "structlog>=24.1.0",
    "paramiko>=3.4.0",
    "neo4j>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
]
web = [
    "playwright>=1.41.0",
]
reports = [
    "weasyprint>=61.0",
    "python-docx>=1.1.0",
]
rag = [
    "chromadb>=0.4.0",
    "sentence-transformers>=2.3.0",
]

[project.scripts]
pen-ai = "app.cli.main:app"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
